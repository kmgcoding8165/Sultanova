<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Galaxy — ИИ простыми словами</title>
<meta name="description" content="Какие бывают нейросети, какую выбрать и как с ними работать. Простыми словами, с живой лентой новостей. / AI explained in plain words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050816; --bg2:#0a1030; --card:rgba(14,24,64,.62); --ink:#e8f0ff; --muted:#9db0dd; --line:rgba(110,160,255,.22);
  --b1:#2f7bff; --b2:#00d4ff; --b3:#7c5cff; --ok:#27e6a3; --warn:#ffb84d;
  --glow:0 0 28px rgba(47,123,255,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.65 Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%,#10307a 0%,transparent 60%),radial-gradient(900px 600px at -10% 40%,#16105a 0%,transparent 60%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;position:relative}
section{padding:80px 0;position:relative}
h1,h2,h3{line-height:1.18;margin:0 0 .5em}
h1,h2,.logo,.cap{font-family:Orbitron,Inter,sans-serif}
h2{font-size:clamp(24px,3.6vw,36px);letter-spacing:.01em}
h2::after{content:"";display:block;width:70px;height:3px;margin-top:12px;border-radius:3px;background:linear-gradient(90deg,var(--b2),var(--b3));box-shadow:0 0 14px var(--b2)}
.lead{color:var(--muted);max-width:740px;margin:0 0 34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;border:0;font:600 1em Inter,sans-serif;cursor:pointer;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 6px 22px rgba(0,140,255,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 32px rgba(0,190,255,.55)}
.btn.ghost{background:rgba(20,40,100,.35);box-shadow:0 0 0 1px var(--line) inset}
.btn.sm{padding:9px 15px;font-size:.92em}
.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,40,.45)}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(5,8,22,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.logo{font-weight:800;font-size:1.1em;text-decoration:none;margin-right:auto;letter-spacing:.04em}
.logo span{background:linear-gradient(90deg,var(--b2),var(--b3));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav a.l{text-decoration:none;color:var(--muted);font-size:.93em}
.nav a.l:hover{color:#fff;text-shadow:0 0 12px var(--b2)}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;font:700 .85em Inter}
.lang button.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff}
.bell{position:relative;background:rgba(20,40,100,.4);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:18px;color:#fff}
.bell b{position:absolute;top:-6px;right:-6px;background:#ff3d71;color:#fff;border-radius:99px;font:700 11px/19px Inter;min-width:19px;height:19px;text-align:center}
@media(max-width:900px){.nav a.l{display:none}}

/* ticker */
.ticker{background:linear-gradient(90deg,#0b2a7a,#1456d6 50%,#0b2a7a);overflow:hidden;white-space:nowrap;font-size:.9em;border-bottom:1px solid var(--line)}
.ticker div{display:inline-block;padding:8px 0;animation:run 90s linear infinite}
.ticker:hover div{animation-play-state:paused}
.ticker a{margin:0 30px;text-decoration:none}
.ticker a:hover{text-decoration:underline}
@keyframes run{to{transform:translateX(-50%)}}

/* hero */
.hero{padding:60px 0 30px}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.eyebrow{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:99px;color:var(--b2);font-size:.82em;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,150,255,.08);margin-bottom:18px}
.hero h1{font-size:clamp(32px,5.4vw,56px);letter-spacing:.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--b2),#7ab6ff,var(--b3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,200,255,.35))}
.hero p{color:var(--muted);font-size:1.1em;max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.stats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.stats div{font-size:.85em;color:var(--muted)}
.stats b{display:block;font:800 1.6em Orbitron;color:#fff;text-shadow:0 0 16px var(--b1)}
.space{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.space .aura{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,170,255,.34),rgba(60,80,255,.16) 55%,transparent 72%);filter:blur(10px);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);opacity:.8}}
.space .pl{position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;z-index:2;filter:drop-shadow(0 0 34px rgba(40,140,255,.65))}
.space .ringw{position:absolute;left:3%;top:3%;width:94%;height:94%;z-index:1;pointer-events:none;transform:rotate(-16deg) scaleY(.26)}
.space .ringw.front{z-index:3;clip-path:inset(50% 0 0 0)}
.space .ringw i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,transparent 56%,rgba(150,215,255,.0) 57%,rgba(120,200,255,.55) 60%,rgba(90,130,255,.22) 64%,rgba(190,225,255,.5) 68%,rgba(130,110,255,.25) 74%,rgba(150,210,255,.45) 78%,transparent 80%);filter:blur(.6px)}
.space .glint{position:absolute;z-index:4;left:40%;top:30%;width:14%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent);filter:blur(8px);mix-blend-mode:screen;pointer-events:none}
.orbit-ring{position:absolute;inset:4%;border:1px solid rgba(110,170,255,.22);border-radius:50%;animation:spin 70s linear infinite}
.orbit-ring::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:#7ae0ff;box-shadow:0 0 14px 3px #3cc8ff}
.orbit-ring2{inset:-6%;animation-duration:110s;animation-direction:reverse;border-color:rgba(150,110,255,.22)}
.orbit-ring2::after{background:#b79cff;box-shadow:0 0 14px 3px #8a63ff}
.sat{position:absolute;width:19%;aspect-ratio:1;border-radius:24%;display:grid;place-items:center;background:rgba(10,24,70,.75);border:1px solid var(--line);box-shadow:var(--glow);transition:transform .2s,box-shadow .2s;animation:bob 6s ease-in-out infinite}
.sat:hover{transform:scale(1.18);box-shadow:0 0 36px rgba(0,212,255,.8)}
.sat img{width:56%;height:56%;border-radius:8px}
@keyframes bob{50%{translate:0 -10px}}
.rocket{position:absolute;z-index:5;width:34px;height:34px;offset-path:path("M60 440 C 20 120, 460 60, 480 330");offset-rotate:auto 90deg;animation:fly 11s linear infinite;filter:drop-shadow(0 0 10px #4cf)}
.rocket svg{width:100%;height:100%}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr}.rocket{display:none}}

/* planets decor */
.deco-planet{position:absolute;pointer-events:none;z-index:0;opacity:.95;border-radius:50%;width:300px;height:300px}
.deco-planet.r{right:-110px;top:20px;filter:drop-shadow(0 0 40px rgba(110,90,255,.55))}
.deco-planet.l{left:-130px;top:40px;filter:drop-shadow(0 0 40px rgba(40,170,255,.5))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;background:var(--neb) center/cover;mix-blend-mode:screen;animation:drift 80s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,1.5%)}}
.ic svg{width:30px;height:30px;stroke:url(#ig);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:1300px){.deco-planet{opacity:.35}}

/* news */
.news-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.85em;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(39,230,163,.8);animation:pulse 1.8s infinite}
.live.off{color:var(--warn)}.live.off i{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(39,230,163,0)}100%{box-shadow:0 0 0 0 rgba(39,230,163,0)}}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.nitem{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;transition:transform .2s,box-shadow .2s}
.nitem:hover{transform:translateY(-5px);box-shadow:0 0 30px rgba(47,123,255,.5)}
.nitem .th{height:130px;background:linear-gradient(135deg,#123a9c,#4b2fc9) center/cover;display:grid;place-items:center;font-size:40px}
.nitem .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.nitem b{font-weight:600;font-size:.97em;line-height:1.35}
.nitem small{color:var(--muted);margin-top:auto;font-size:.8em}

/* types */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px;position:relative;z-index:1}
.type{padding:24px;transition:transform .2s,box-shadow .2s}
.type:hover{transform:translateY(-4px);box-shadow:0 0 30px rgba(47,123,255,.4)}
.type .ic{font-size:30px;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 30% 30%,rgba(0,212,255,.35),rgba(47,123,255,.12));border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--glow)}
.type h3{font-size:1.1em}
.type p{margin:.3em 0;color:var(--muted);font-size:.95em}
.type .ex{font-size:.86em;margin-top:10px;color:var(--b2)}

/* picker */
.picker{padding:28px;position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:rgba(20,40,100,.3);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;font:500 .93em Inter}
.chip:hover{border-color:var(--b2);box-shadow:0 0 14px rgba(0,212,255,.3)}
.chip.on{background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent;color:#fff;box-shadow:var(--glow)}
.q{font-weight:700;margin:18px 0 10px}
#result{margin-top:22px;display:grid;gap:14px}
.rec{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:rgba(5,12,40,.5)}
.rec.first{border-color:var(--ok);box-shadow:0 0 22px rgba(39,230,163,.25)}
.rec img{width:52px;height:52px;border-radius:14px;background:#fff;padding:7px}
.rec .t{flex:1}
.rec small{display:block;color:var(--muted);line-height:1.4}
.badge{display:inline-block;background:var(--ok);color:#022;font-weight:700;font-size:.7em;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
@media(max-width:560px){.rec{flex-wrap:wrap}.rec .btn{width:100%}}

/* catalog */
.filters{margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;position:relative;z-index:1}
.card{overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 0 36px rgba(47,123,255,.5)}
.card .pic{display:grid;place-items:center;height:150px;position:relative;text-decoration:none;overflow:hidden}
.card .pic::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%,rgba(3,6,28,.55))}
.card .pic::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);filter:blur(6px)}
.card .pic img{position:relative;z-index:1;width:78px;height:78px;border-radius:20px;background:#fff;padding:11px;box-shadow:0 0 34px rgba(0,200,255,.55);transition:transform .2s}
.card .pic:hover img{transform:scale(1.12) rotate(-3deg)}
.card .pic i{position:absolute;z-index:1;right:12px;bottom:10px;font-style:normal;font-size:.75em;background:rgba(0,10,40,.6);padding:3px 11px;border-radius:99px;border:1px solid var(--line)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:1.2em}
.card .tag{font-size:.75em;color:var(--b2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.card p{margin:0;color:var(--muted);font-size:.94em}
.card ul{margin:0;padding-left:18px;font-size:.92em}
.card .meta{font-size:.85em;display:grid;gap:3px;border-top:1px dashed var(--line);padding-top:10px}
.card .meta span{color:var(--muted)}
.card .go{margin-top:auto}
.card .go .btn{width:100%}

/* learn */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.step{padding:22px 20px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b3));font:800 .95em Orbitron;margin-bottom:10px;box-shadow:var(--glow)}
.step h3{font-size:1.02em}
.step p{margin:0;color:var(--muted);font-size:.94em}
.formula{border-radius:24px;padding:28px;margin:30px 0;display:grid;gap:14px;background:linear-gradient(135deg,rgba(47,123,255,.4),rgba(124,92,255,.35));border:1px solid var(--line);box-shadow:var(--glow)}
.formula h3{margin:0}
.formula .parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.formula .parts div{background:rgba(5,10,40,.5);border-radius:14px;padding:12px 14px;font-size:.92em}
.formula .parts b{display:block;color:var(--b2)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{border-radius:18px;padding:20px;border:1px solid var(--line);background:var(--card)}
.box.bad{border-color:#ff4d6d}.box.good{border-color:var(--ok)}
.box h4{margin:0 0 8px}
.box code{display:block;white-space:pre-wrap;font:inherit;font-size:.94em;background:rgba(0,0,0,.3);padding:12px;border-radius:12px}
.box p{color:var(--muted);margin:8px 0 0}
@media(max-width:700px){.compare{grid-template-columns:1fr}}
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:10px}
.prompt{padding:18px;display:flex;flex-direction:column;gap:10px}
.prompt h4{margin:0}
.prompt p{margin:0;font-size:.9em;background:rgba(0,0,0,.3);padding:12px;border-radius:12px;color:var(--muted);flex:1}
.safe{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.safe div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:16px 18px}
.safe b{display:block;margin-bottom:4px}
.safe span{color:var(--muted);font-size:.93em}
h3.sub{margin-top:40px;font-size:1.3em}

details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px;backdrop-filter:blur(8px)}
summary{cursor:pointer;font-weight:600}
details[open]{border-color:var(--b2)}
details p{margin:10px 0 0;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media(max-width:800px){.two{grid-template-columns:1fr}}

footer{padding:40px 0;color:var(--muted);font-size:.88em;border-top:1px solid var(--line);background:rgba(3,6,20,.6)}

/* toasts + panel */
#toasts{position:fixed;right:18px;bottom:18px;z-index:100;display:grid;gap:10px;width:min(370px,calc(100vw - 36px))}
.toast{background:rgba(10,22,70,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-left:4px solid var(--b2);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6),var(--glow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:in .4s ease both;font-size:.9em}
.toast.out{animation:out .35s ease forwards}
.toast .em{font-size:24px}
.toast b{display:block;color:var(--b2);font-size:.8em;letter-spacing:.08em;text-transform:uppercase}
.toast a{text-decoration:none}
.toast a:hover{text-decoration:underline}
.toast small{color:var(--muted)}
.toast button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
@keyframes in{from{opacity:0;transform:translateX(40px)}}
@keyframes out{to{opacity:0;transform:translateX(40px)}}
#panel{position:fixed;top:72px;right:18px;z-index:90;width:min(410px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:rgba(8,18,60,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:14px;display:none}
#panel.open{display:block}
#panel h4{margin:4px 6px 10px}
#panel .it{display:flex;gap:10px;padding:10px 6px;border-top:1px solid var(--line);font-size:.9em}
#panel .it small{color:var(--muted);display:block}
#panel .it a{text-decoration:none}
#panel .it a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7ff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient></defs></svg>
<canvas id="stars"></canvas>

<header>
  <div class="wrap nav">
    <a class="logo" href="#top">🪐 AI <span>GALAXY</span></a>
    <a class="l" href="#news" data-i="nav_news"></a>
    <a class="l" href="#types" data-i="nav_types"></a>
    <a class="l" href="#picker" data-i="nav_pick"></a>
    <a class="l" href="#catalog" data-i="nav_cat"></a>
    <a class="l" href="#learn" data-i="nav_learn"></a>
    <a class="l" href="#faq" data-i="nav_faq"></a>
    <div class="lang"><button id="bru">RU</button><button id="bkk">ҚАЗ</button><button id="ben">EN</button></div>
    <button class="bell" id="bell" aria-label="News">🔔<b id="cnt">0</b></button>
  </div>
</header>
<div class="ticker"><div id="tick"></div></div>
<div id="panel"><h4 data-i="panel_t"></h4><div id="plist"></div></div>
<div id="toasts" aria-live="polite"></div>

<main id="top">
<section class="hero">
  <div class="wrap grid">
    <div>
      <span class="eyebrow" data-i="eyebrow"></span>
      <h1><span data-i="h1a"></span> <em data-i="h1b"></em></h1>
      <p data-i="hero_p"></p>
      <div class="cta">
        <a class="btn" href="#picker" data-i="cta1"></a>
        <a class="btn ghost" href="#learn" data-i="cta2"></a>
      </div>
      <div class="stats">
        <div><b id="s1">17</b><span data-i="st1"></span></div>
        <div><b>7</b><span data-i="st2"></span></div>
        <div><b>24/7</b><span data-i="st3"></span></div>
      </div>
    </div>
    <div class="space" id="space">
      <div class="aura"></div>
      <div class="ringw"><i></i></div>
      <canvas class="pl" id="hp" width="300" height="300"></canvas>
      <div class="ringw front"><i></i></div>
      <div class="glint"></div>
      <div class="orbit-ring"></div><div class="orbit-ring orbit-ring2"></div>
      <div class="rocket" aria-hidden="true"><svg viewBox="0 0 32 32"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7ad7ff"/></linearGradient></defs><path d="M16 2c5 4 7 10 6 18l-3 3h-6l-3-3c-1-8 1-14 6-18z" fill="url(#rg)"/><circle cx="16" cy="12" r="2.6" fill="#1a4bd6"/><path d="M10 18l-5 6 5-1zM22 18l5 6-5-1z" fill="#4aa8ff"/><path d="M13 25c1 4 2 5 3 6 1-1 2-2 3-6z" fill="#ffb347"/></svg></div>
    </div>
  </div>
</section>

<section id="news">

/* процедурная планета: шум -> палитра -> сфера с освещением, облаками и атмосферой */
function planet(cv,o){
  const S=cv.width,R=S/2,ctx=cv.getContext('2d'),W=256,H=128;
  let sd=o.seed*7919+13;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const sm=t=>t*t*(3-2*t);
  const noise=(bands)=>{
    const L=[];for(let k=0;k<5;k++){const n=4<<k,rows=n/2+1,g=new Float32Array(n*rows);for(let i=0;i<g.length;i++)g[i]=rnd();L.push({n,g})}
    const t=new Float32Array(W*H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0,amp=.5,tot=0;
      for(let k=0;k<5;k++){const {n,g}=L[k],fx=x/W*n,fy=y/H*(n/2),x0=Math.floor(fx),y0=Math.floor(fy),tx=sm(fx-x0),ty=sm(fy-y0);
        const q=(i,j)=>g[(j)*n+(i%n)];
        const v=(q(x0,y0)*(1-tx)+q(x0+1,y0)*tx)*(1-ty)+(q(x0,y0+1)*(1-tx)+q(x0+1,y0+1)*tx)*ty;
        a+=v*amp;tot+=amp;amp*=.5}
      a/=tot;
      if(bands)a=a*.65+.35*(.5+.5*Math.sin(y/H*Math.PI*bands+a*5));
      t[y*W+x]=Math.min(1,Math.max(0,(a-.2)*1.6))}
    return t};
  const tex=noise(o.bands||0),cl=noise(0);
  const lut=new Uint8Array(256*3);
  for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<o.pal.length-2&&v>o.pal[k+1][0])k++;
    const [p0,c0]=o.pal[k],[p1,c1]=o.pal[k+1],f=Math.min(1,Math.max(0,(v-p0)/(p1-p0)));
    for(let c=0;c<3;c++)lut[i*3+c]=c0[c]+(c1[c]-c0[c])*f}
  const N=S*S,lon=new Float32Array(N),row=new Int16Array(N),dif=new Float32Array(N),fre=new Float32Array(N),alp=new Uint8Array(N);
  const Lx=-.55,Ly=-.45,Lz=.7,Ln=Math.hypot(Lx,Ly,Lz);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=y*S+x,nx=(x+.5-R)/R,ny=(y+.5-R)/R,d2=nx*nx+ny*ny;
    if(d2>1){alp[i]=0;continue}
    const nz=Math.sqrt(1-d2);lon[i]=Math.atan2(nx,nz);row[i]=Math.min(H-1,Math.floor((.5-Math.asin(-ny)/Math.PI)*H));
    const dd=(nx*Lx+ny*Ly+nz*Lz)/Ln;dif[i]=sm(Math.min(1,Math.max(0,(dd+.12)/.9)));fre[i]=Math.pow(1-nz,2.6);
    alp[i]=Math.min(255,Math.max(1,(1-Math.sqrt(d2))*R*180))}
  const img=ctx.createImageData(S,S),d=img.data,at=o.atm||[90,170,255];let rot=0,last=0,vis=true;
  const draw=()=>{const cr=rot*1.35;
    for(let i=0;i<N;i++){const a=alp[i];if(!a){d[i*4+3]=0;continue}
      let u=((lon[i]+rot)/6.2832%1+1)%1,idx=row[i]*W+(u*W|0);
      let v=tex[idx],li=(v*255|0)*3,r=lut[li],g=lut[li+1],b=lut[li+2];
      let u2=((lon[i]+cr)/6.2832%1+1)%1,c=Math.max(0,cl[row[i]*W+(u2*W|0)]-(o.cloudCut||.5))*(o.cloud||1.6);
      if(c>0){c=Math.min(c,.85);r+=(245-r)*c;g+=(250-g)*c;b+=(255-b)*c}
      const sh=.05+.95*dif[i],f=fre[i]*(.35+dif[i]*.9);
      d[i*4]=Math.min(255,r*sh+at[0]*f);d[i*4+1]=Math.min(255,g*sh+at[1]*f);d[i*4+2]=Math.min(255,b*sh+at[2]*f);d[i*4+3]=a}
    ctx.putImageData(img,0,0)};
  draw();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(cv);
  (function f(ts){requestAnimationFrame(f);if(!vis||ts-last<45)return;last=ts;rot+=o.speed||.012;draw()})(0);

/* ================== ЗВЁЗДНОЕ НЕБО ================== */
(()=>{
  const c=$('stars'),x=c.getContext('2d');let W,H,S=[],sh=[],sy=0;
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:Math.min(260,Math.floor(W*H/6500))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,p:Math.random()*6.28,s:Math.random()*.02+.005,d:Math.random()*.6+.1,h:Math.random()<.25?200:Math.random()<.5?220:260}))};
  addEventListener('resize',rs);rs();addEventListener('scroll',()=>sy=scrollY,{passive:true});
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function f(){
    x.clearRect(0,0,W,H);
    for(const s of S){s.p+=s.s;const a=.45+.55*Math.sin(s.p);let y=(s.y-sy*s.d*.25)%H;if(y<0)y+=H;
      x.fillStyle=`hsla(${s.h},90%,${75+a*20}%,${a})`;x.beginPath();x.arc(s.x,y,s.r,0,6.283);x.fill()}
    if(!reduce&&Math.random()<.008&&sh.length<2)sh.push({x:Math.random()*W,y:Math.random()*H*.5,l:0,v:9+Math.random()*6});
    sh=sh.filter(m=>{m.x+=m.v;m.y+=m.v*.55;m.l++;const g=x.createLinearGradient(m.x,m.y,m.x-90,m.y-50);g.addColorStop(0,'rgba(160,220,255,.95)');g.addColorStop(1,'rgba(160,220,255,0)');
      x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(m.x,m.y);x.lineTo(m.x-90,m.y-50);x.stroke();return m.l<60});
    requestAnimationFrame(f)})();
})();

/* ================== РЕНДЕР КОНТЕНТА ================== */
let goal=null,prefs=new Set(),cat='all';

function renderStatic(){
  document.documentElement.lang=LANG;
  document.title={ru:'AI Galaxy — ИИ простыми словами',kk:'AI Galaxy — ЖИ қарапайым тілмен',en:'AI Galaxy — AI in plain words'}[LANG];
  document.querySelectorAll('[data-i]').forEach(n=>n.textContent=T(UI[n.dataset.i]));
  $('bru').classList.toggle('on',LANG==='ru');$('ben').classList.toggle('on',LANG==='en');

  $('typesbox').innerHTML=TYPES.map(([ic,h,p,ex])=>`<div class="type glass"><div class="ic">${icon(ic)}</div><h3>${T(h)}</h3><p>${T(p)}</p><div class="ex">${T({ru:'Примеры: ',en:'Examples: '})}${ex}</div></div>`).join('');

  const gb=$('goals');gb.innerHTML='';
  GOALS.forEach((g,i)=>{const b=el('button','chip'+(goal===i?' on':''),T(g[0]));b.onclick=()=>{goal=i;renderStatic_goals();renderRec()};gb.appendChild(b)});
  const pb=$('prefs');pb.innerHTML='';
  Object.entries(PREFS).forEach(([k,p])=>{const b=el('button','chip'+(prefs.has(k)?' on':''),T(p[0]));b.onclick=()=>{prefs.has(k)?prefs.delete(k):prefs.add(k);b.classList.toggle('on');renderRec()};pb.appendChild(b)});
  renderRec();

  const fb=$('filters');fb.innerHTML='';
  Object.entries(CATS).forEach(([k,v])=>{const b=el('button','chip'+(cat===k?' on':''),T(v));b.onclick=()=>{cat=k;[...fb.children].forEach(c=>c.classList.toggle('on',c===b));drawCards()};fb.appendChild(b)});
  drawCards();

  $('first').innerHTML=FIRST.map(([h,p])=>`<div class="step glass"><h3>${T(h)}</h3><p>${T(p)}</p></div>`).join('');
  $('parts').innerHTML=PARTS.map(([h,p])=>`<div><b>${T(h)}</b>${T(p)}</div>`).join('');
  $('compare').innerHTML=['bad','good'].map(k=>`<div class="box ${k}"><h4>${T(COMPARE[k].h)}</h4><code>${esc(T(COMPARE[k].c))}</code><p>${T(COMPARE[k].p)}</p></div>`).join('');
  const pr=$('prompts');pr.innerHTML='';
  PROMPTS.forEach(([t,p])=>{const d=el('div','prompt glass',`<h4>${T(t)}</h4><p>${esc(T(p))}</p>`);
    const b=el('button','btn sm ghost',T(UI.copy));
    b.onclick=async()=>{try{await navigator.clipboard.writeText(T(p));b.textContent=T(UI.copied)}catch{}setTimeout(()=>b.textContent=T(UI.copy),1800)};d.appendChild(b);pr.appendChild(d)});
  $('tips').innerHTML=TIPS.map(([h,p])=>`<div class="step glass"><h3>${T(h)}</h3><p>${T(p)}</p></div>`).join('');
  $('safe').innerHTML=SAFE.map(([h,p])=>`<div><b>${T(h)}</b><span>${T(p)}</span></div>`).join('');
  const fq=l=>l.map(([q,a])=>`<details><summary>${T(q)}</summary><p>${T(a)}</p></details>`).join('');
  $('faq1').innerHTML=fq(FAQ1);$('faq2').innerHTML=fq(FAQ2);
}
function renderStatic_goals(){[...$('goals').children].forEach((c,i)=>c.classList.toggle('on',i===goal))}

function renderRec(){
  const res=$('result');res.innerHTML='';
  if(goal==null){res.innerHTML=`<p style="color:var(--muted)">${T(UI.pick_empty)}</p>`;return}
  let ids=GOALS[goal][1].slice(),note=false;
  prefs.forEach(k=>{
    const keep=PREFS[k][1],f=ids.filter(i=>keep.includes(i));
    if(k==='office'||k==='google'){ids=[...f,...ids.filter(i=>!f.includes(i))];if(!f.length)note=true}
    else if(f.length)ids=f;
  });
  if(note)res.insertAdjacentHTML('beforeend',`<p style="color:var(--muted)">${T(UI.pick_note)}</p>`);
  ids.slice(0,3).forEach((id,i)=>{const a=byId(id);
    res.insertAdjacentHTML('beforeend',`<div class="rec${i?'':' first'}"><a href="${a.url}" target="_blank" rel="noopener">${imgTag(a)}</a>
      <div class="t"><b>${esc(a.name)}</b>${i?'':`<span class="badge">${T(UI.best_choice)}</span>`}<small>${T(WHY[id])}</small><small>${T(a.price)}</small></div>
      <a class="btn sm" href="${a.url}" target="_blank" rel="noopener">${T(UI.open_arrow)}</a></div>`)});
}

function drawCards(){
  const box=$('cards');box.innerHTML='';
  AIS.filter(a=>cat==='all'||a.cat===cat).forEach((a,i)=>{
    const [c1,c2]=a.color.split(',');
    box.insertAdjacentHTML('beforeend',`<article class="card glass">
      <a class="pic" href="${a.url}" target="_blank" rel="noopener" style="background:${nebula(c1,c2,i+3)} center/cover" aria-label="${esc(a.name)}">${imgTag(a)}<i>${T(UI.click_open)}</i></a>
      <div class="body"><div class="tag">${T(CATS[a.cat]).replace(/^\S+\s/,'')} · ${esc(a.by)}</div><h3>${esc(a.name)}</h3><p>${T(a.d)}</p>
      <ul>${T(a.f).map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="meta"><div><span>${T(UI.best_for)}</span> ${T(a.best)}</div><div><span>${T(UI.price)}</span> ${T(a.price)}</div><div><span>${T(UI.rulang)}</span> ${T(a.lang)}</div></div>
      <div class="go"><a class="btn" href="${a.url}" target="_blank" rel="noopener">${T(UI.open)} ${esc(a.name)} ↗</a></div></div></article>`)});
}

/* ================== РЕАЛЬНЫЕ НОВОСТИ ================== */
const FEEDS={
  ru:{url:'https://habr.com/ru/rss/hubs/artificial_intelligence/all/',src:'Хабр'},
  en:{url:'https://techcrunch.com/category/artificial-intelligence/feed/',src:'TechCrunch'},
  kk:{url:'https://kaz.nur.kz/rss/all.rss',src:'NUR.KZ'}
};
const SAVED={
  kk:[{title:'ЖИ жаңалықтары — Хабр',link:'https://habr.com/ru/hubs/artificial_intelligence/'},{title:'Жасанды интеллект: жаңа модельдер мен құралдар',link:'https://kaz.nur.kz/'},{title:'Нейрожелілер: қалай бастау керек',link:'https://habr.com/ru/hubs/artificial_intelligence/'}],
  ru:[{title:'Нейросети: как начать пользоваться и не навредить себе',link:'https://habr.com/ru/hubs/artificial_intelligence/'},{title:'Новые модели ИИ: что умеют сегодня чат-боты',link:'https://habr.com/ru/hubs/artificial_intelligence/'},{title:'Генерация изображений и видео: свежие инструменты',link:'https://habr.com/ru/hubs/artificial_intelligence/'}],
  en:[{title:'AI news — the latest from TechCrunch',link:'https://techcrunch.com/category/artificial-intelligence/'},{title:'New AI models: what chatbots can do today',link:'https://techcrunch.com/category/artificial-intelligence/'},{title:'AI tools for images and video: what is new',link:'https://techcrunch.com/category/artificial-intelligence/'}]
};
const cache={};let news=[],queue=[],shown=new Set(),cnt=0,seen=[];
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
function fmt(d){const t=new Date(String(d||'').replace(' ','T')+'Z');if(isNaN(t))return '';if(LANG==='kk'){const M=['қаң.','ақп.','нау.','сәу.','мам.','мау.','шіл.','там.','қыр.','қаз.','қар.','жел.'],z=n=>String(n).padStart(2,'0');return t.getDate()+' '+M[t.getMonth()]+', '+z(t.getHours())+':'+z(t.getMinutes())}return t.toLocaleString(LANG==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

const AIKW=/жасанды интеллект|жасанды зият|нейро|\bЖИ\b|чат-?бот|ChatGPT|OpenAI|Gemini|Claude|DeepSeek|робот|алгоритм|технолог|цифр|смартфон|интернет|Google|Яндекс|Microsoft|Apple|Samsung|Tesla|ғарыш/i;
async function getFeed(url,src){
  const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url));
  const j=await r.json();if(j.status!=='ok'||!j.items||!j.items.length)throw 0;
  return j.items.map(i=>({title:dec(i.title),link:i.link,date:i.pubDate,img:i.thumbnail||(i.enclosure&&i.enclosure.link)||'',src}));
}
async function loadNews(){
  const lang=LANG,live=$('live');
  live.className='live';$('livet').textContent=T(UI.live_load);
  try{
    let items;
    if(lang==='kk'){
      /* казахскоязычные новости (NUR.KZ), отобранные по теме технологий и ИИ, + свежие статьи об ИИ с Хабра */
      const [a,b]=await Promise.allSettled([getFeed(FEEDS.kk.url,'NUR.KZ'),getFeed(FEEDS.ru.url,'Хабр')]);
      const kz=a.status==='fulfilled'?a.value.filter(n=>AIKW.test(n.title)):[];
      const hb=b.status==='fulfilled'?b.value:[];
      items=[];const m=Math.max(kz.length,hb.length);
      for(let i=0;i<m;i++){if(kz[i])items.push(kz[i]);if(hb[i])items.push(hb[i])}
      if(!items.length)throw 0;
    }else items=await getFeed(FEEDS[lang].url,FEEDS[lang].src);
    cache[lang]=items.slice(0,24);
    if(lang!==LANG)return;
    news=cache[lang];live.className='live';$('livet').textContent=T(UI.live_on)+' '+new Date().toLocaleTimeString(({ru:'ru-RU',kk:'kk-KZ',en:'en-US'}[LANG]),{hour:'2-digit',minute:'2-digit'});
  }catch{
    if(lang!==LANG)return;
    news=cache[lang]||SAVED[lang].map(x=>({...x,date:'',img:'',src:FEEDS[lang].src}));
    live.className='live off';$('livet').textContent=T(UI.live_off);
  }
  drawNews();
}function drawNews(){
  const box=$('newsbox');box.innerHTML='';
  news.slice(0,8).forEach(n=>{
    const a=el('a','nitem glass');a.href=safeUrl(n.link);a.target='_blank';a.rel='noopener';
    const th=el('div','th');
    if(n.img&&/^https?:/.test(n.img)){th.style.backgroundImage=`linear-gradient(180deg,transparent 40%,rgba(5,8,30,.7)),url("${n.img.replace(/"/g,'%22')}")`}else th.style.backgroundImage=nebula('#12378f','#4b2fc9',Math.floor(Math.random()*40)+1);
    const tx=el('div','tx');const b=el('b');b.textContent=n.title;const s=el('small');s.textContent=[n.src,fmt(n.date)].filter(Boolean).join(' · ')+'  '+T(UI.read);
    tx.append(b,s);a.append(th,tx);box.appendChild(a)});
  /* бегущая строка */
  const h=news.map(n=>`<a href="${safeUrl(n.link)}" target="_blank" rel="noopener">🆕 ${esc(n.title)}</a>`).join('');
  $('tick').innerHTML=h+h;
  queue=news.slice();
}

function notify(){
  if(!news.length)return;
  if(!queue.length)queue=news.slice();
  const n=queue.shift();
  const t=el('div','toast');
  t.innerHTML=`<div class="em">🛰️</div><div><b>${T(UI.toast_t)} · ${esc(n.src)}</b><a href="${safeUrl(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><br><small>${esc(fmt(n.date))}</small></div><button aria-label="×">×</button>`;
  const close=()=>{t.classList.add('out');setTimeout(()=>t.remove(),350)};
  t.querySelector('button').onclick=close;$('toasts').appendChild(t);
  while($('toasts').children.length>3)$('toasts').firstChild.remove();
  setTimeout(close,9000);
  $('cnt').textContent=++cnt;
  seen.unshift(n);seen=seen.slice(0,20);
  $('plist').innerHTML=seen.map(x=>`<div class="it"><span>🆕</span><div><a href="${safeUrl(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><small>${esc(x.src)} ${esc(fmt(x.date))}</small></div></div>`).join('');
}

/* ================== СТАРТ ================== */
function setLang(l){LANG=l;try{localStorage.setItem('lang',l)}catch{};seen=[];$('plist').innerHTML='';renderStatic();news=cache[l]||[];if(news.length)drawNews();loadNews()}
$('bru').onclick=()=>setLang('ru');$('ben').onclick=()=>setLang('en');
$('bell').onclick=()=>{$('panel').classList.toggle('open');$('cnt').textContent=0;cnt=0};
document.addEventListener('click',e=>{if(!$('panel').contains(e.target)&&!e.target.closest('#bell'))$('panel').classList.remove('open')});
renderStatic();loadNews();
setTimeout(notify,3500);setInterval(notify,13000);
setInterval(loadNews,5*60*1000);
</script>
